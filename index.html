<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Noticias</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="encabezado">
        <h1>NOTICIAS AL DÍA</h1>
        <p>Tu espacio de información y tecnología</p>
    </header>

    <main class="contenedor">
        <section class="bienvenida">
            <h2>Últimas noticias</h2>
            <p>Descubre las noticias más recientes sobre tecnología.</p>

            <button id="actualizar">Actualizar noticias</button>
        </section>

        <p id="mensaje">Cargando noticias...</p>

        <section id="noticias" class="noticias">
        </section>
    </main>

    <footer>
        <p>Proyecto desarrollado con HTML, CSS y JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
